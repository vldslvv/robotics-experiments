[project]
name = "robotics-experiments"
version = "0.0.0"
description = "Checkout-only robotics experiments integrating Isaac Sim, ROS 2, and PX4."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Unknown" }]

dependencies = [
  "numpy==1.26.0",
  "scipy>=1.11,<2",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
  "debugpy",
  "pytest",
  "pre-commit==4.5.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "vulture==2.16",
  "types-requests",
]
simulation = [
  "isaacsim==5.1.0.0",
  "isaacsim-core==5.1.0.0",
  "usd-core>=25.11,<27",
]
training = [
  "rsl-rl-lib>=3.1.2,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored Pegasus simulator code is excluded from linting and formatting.
# force-exclude makes ruff honor this even when pre-commit passes files explicitly.
force-exclude = true
extend-exclude = ["isaac/runtime/extensions/px4_sitl_brigde/pegasus/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Keep default rule set minimal; repos often extend it over time.
# SLF enforces "no external private-member access": tests assert on public
# behavior (properties, return values, raised errors, recorded contract seams)
# rather than reaching into a unit's private state. The grandfathered exceptions
# below are the legitimate intended patterns (fixture injection against vendored
# or Isaac code, focused private-helper unit tests, deliberate corruption/fault
# injection) that have no public seam.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "SLF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"isaac/runtime/extensions/extension_template/ExtensionMinimalTemplate_python/__init__.py" = ["F403"]
# The vendored Pegasus tree is fully excluded via extend-exclude above, so no
# per-file lint ignores are needed for it here.
# SLF001 grandfathers -- external private access that is the intended pattern:
# Production drives the vendored Pegasus backend's private state (no public seam).
"src/robotics_experiments/px4_bridge/mavlink.py" = ["SLF001"]
# Isaac Lab articulation exposes reset indices only as a private attribute.
"src/robotics_experiments/workflows/isaac_lab/tasks/drone_hover_env.py" = ["SLF001"]
# Bridge unit tests inject a fake connection into the vendored Pegasus backend
# (fixture injection; the backend builds its own connection otherwise).
"tests/src/robotics_experiments/px4_bridge/test_px4_bridge_sensors.py" = ["SLF001"]
"tests/src/robotics_experiments/px4_bridge/test_px4_bridge_lockstep.py" = ["SLF001"]
"tests/src/robotics_experiments/px4_bridge/test_px4_bridge_actuator.py" = ["SLF001"]
# Fake-state fixture injection (there is no live Isaac stage to initialize).
"tests/src/robotics_experiments/px4_bridge/test_isaac_articulation.py" = ["SLF001"]
# Focused private-helper unit tests over fixture-/importorskip-gated modules
# (the modules cannot be imported at top level to bind the helpers by name).
"tests/isaac/runtime/standalone/test_usd_builder_config.py" = ["SLF001"]
# Negative-test fault injection: swaps the bridge's thrust model for a faulty one.
"isaac/runtime/standalone/tests/test_px4_takeoff_instability_detection.py" = ["SLF001"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
# Interface parameters on seam Protocols whose consuming implementations live
# outside src (rsl_rl's OnPolicyRunner.learn) or arrive with F5 (the synthetic
# pose provider is the first to actually read sample()'s sim_time_s).
ignore_names = ["sim_time_s", "num_learning_iterations", "init_at_random_ep_len"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-q --basetemp=.build/pytest"
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = [
  ".build",
  ".cache",
  ".venv",
]

[tool.uv]
package = false
override-dependencies = [
  "pywin32==306; sys_platform == 'win32'",
]

[tool.uv.sources]
isaacsim = { index = "nvidia" }
isaacsim-core = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true
