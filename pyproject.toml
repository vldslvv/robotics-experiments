[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-experiments"
version = "0.0.0"
description = "Robotics experiments integrating Isaac Sim and ROS 2."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Unknown" }]

dependencies = [
  "isaacsim==5.1.0.0",
  "isaacsim-core==5.1.0.0",
  "numpy==1.26.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
  "debugpy",
  "pre-commit==4.5.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "types-requests",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["robotics_experiments*"]
exclude = ["ros2_ws*", "scans*", "docs*", "scripts*"]

[tool.setuptools.package-data]
robotics_experiments = ["config/conf/*.yaml", "config/conf/*/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Keep default rule set minimal; repos often extend it over time.
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
override-dependencies = [
  "pywin32==306; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
