defaults:
  - base
  - _self_

# Runtime demonstration experiment: two PX4-backed drones take off, fly one
# shared XY circle as phase-offset `goto` waypoints, then land. The two routines
# are independent, so the drones use a small altitude separation instead of
# relying on cross-drone synchronization for clearance.
#
# Coordinates are world ENU metres (x=east, y=north, z=up). The shared circle is
# centered at the world origin with a 2 m radius; drone 0 starts from the south
# point and drone 1 starts from the north point. Each loop climbs over the first
# half-circle and descends over the second half-circle.
#
# Run with: make run-all HYDRA_CONFIG=configs/circle_land_quad_quad.yaml

scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

routine:
  steps: []

vehicles:
  - id: 0
    ros: {namespace: /x500_01}
    spawn_xy: [0.0, -2.0]
    drone: {prim_name: Drone0}
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 1.0
          y: -1.732
          z: 2.6
          timeout_s: 25.0
        - kind: goto
          x: 1.732
          y: -1.0
          z: 2.7
          timeout_s: 25.0
        - kind: goto
          x: 2.0
          y: 0.0
          z: 2.8
          timeout_s: 25.0
        - kind: goto
          x: 1.732
          y: 1.0
          z: 2.9
          timeout_s: 25.0
        - kind: goto
          x: 1.0
          y: 1.732
          z: 3.0
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: 2.0
          z: 3.1
          timeout_s: 25.0
        - kind: goto
          x: -1.0
          y: 1.732
          z: 3.0
          timeout_s: 25.0
        - kind: goto
          x: -1.732
          y: 1.0
          z: 2.9
          timeout_s: 25.0
        - kind: goto
          x: -2.0
          y: 0.0
          z: 2.8
          timeout_s: 25.0
        - kind: goto
          x: -1.732
          y: -1.0
          z: 2.7
          timeout_s: 25.0
        - kind: goto
          x: -1.0
          y: -1.732
          z: 2.6
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: -2.0
          z: 2.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
  - id: 1
    ros: {namespace: /x500_02}
    spawn_xy: [0.0, 2.0]
    drone: {prim_name: Drone1}
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 3.5
          min_climb_m: 2.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: -1.0
          y: 1.732
          z: 3.6
          timeout_s: 25.0
        - kind: goto
          x: -1.732
          y: 1.0
          z: 3.7
          timeout_s: 25.0
        - kind: goto
          x: -2.0
          y: 0.0
          z: 3.8
          timeout_s: 25.0
        - kind: goto
          x: -1.732
          y: -1.0
          z: 3.9
          timeout_s: 25.0
        - kind: goto
          x: -1.0
          y: -1.732
          z: 4.0
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: -2.0
          z: 4.1
          timeout_s: 25.0
        - kind: goto
          x: 1.0
          y: -1.732
          z: 4.0
          timeout_s: 25.0
        - kind: goto
          x: 1.732
          y: -1.0
          z: 3.9
          timeout_s: 25.0
        - kind: goto
          x: 2.0
          y: 0.0
          z: 3.8
          timeout_s: 25.0
        - kind: goto
          x: 1.732
          y: 1.0
          z: 3.7
          timeout_s: 25.0
        - kind: goto
          x: 1.0
          y: 1.732
          z: 3.6
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: 2.0
          z: 3.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
