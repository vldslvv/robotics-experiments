defaults:
  - integration_test_takeoff
  - _self_

# Dual-PX4 multi-drone takeoff experiment. Inherits the single-drone
# integration_test_takeoff experiment (scene + the shared `takeoff` routine with
# its flight-envelope gates) and overrides only the vehicles list below.
#
# Two drones, each bound to its own PX4 SITL instance: id 0/1 -> derived
# simulator ports 4560/4561, GCS links px4.gcs_baseport + id (14550/14551).
# id is the PX4 numeric identity; the ports and the per-vehicle {vehicle} log
# token are all derived from it. ros.namespace is the explicit ROS identity.
# Distinct prim_name avoids prim collisions; the px4 default debug_log_path
# carries the {vehicle} token so the two bridge logs never collide. Spawned ~4m
# apart so the drones never cross within the hover envelope.
vehicles:
  - id: 0
    ros: {namespace: /x500_01}
    spawn_xy: [0.0, 0.0]
    drone: {prim_name: Drone0}
  - id: 1
    ros: {namespace: /x500_02}
    spawn_xy: [4.0, 0.0]
    drone: {prim_name: Drone1}
