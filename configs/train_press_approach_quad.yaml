defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - _self_

# Stage 1 contact-free approach training selection.
scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"

rl:
  num_envs: 32768
  episode_length_s: 10.0
  action:
    max_body_velocity_mps: 0.5
  press:
    policy:
      actor:
        initial_noise_std: 0.12
    goal:
      velocity_reference:
        range_center_m: 0.415
        wall_normal_max_mps: 0.04
    reward:
      range_barrier_margin_m: 0.02
      flight_failure_weight: 300.0
      velocity_tracking_weight: 300.0
      wall_normal_braking_command_weight: 30.0
  training:
    task_id: Isaac-Switch-Press-Direct-v1
    vehicle_id: 0
    policy_name: press-approach
    # Each attempt starts from scratch. Refinement phases restore the
    # attempt-wide validation-selected checkpoint before changing curriculum.
    phases:
      - max_iterations: 241
        evaluation_interval: 10
        learning_rate: 1.0e-4
        schedule: fixed
        entropy_coef: 0.0001
        hard_case_fraction: 0.0
      - max_iterations: 11
        evaluation_interval: 5
        learning_rate: 3.0e-5
        schedule: fixed
        entropy_coef: 0.0
        hard_case_fraction: 0.2
      - max_iterations: 31
        evaluation_interval: 5
        learning_rate: 1.0e-5
        schedule: fixed
        entropy_coef: 0.0
        hard_case_fraction: 0.4
    plateau:
      metric_name: held_out_task_cost
      direction: minimize
      minimum_delta: 0.003
      patience_evaluations: 10
    evaluation_worker_timeout_s: 600.0
    num_steps_per_env: 32
    gamma: 0.995
    lam: 0.95
    clip_param: 0.2
    value_loss_coef: 1.0
    num_learning_epochs: 5
    num_mini_batches: 8
    desired_kl: 0.01
    max_grad_norm: 1.0
    attempt_seeds: [42, 43, 44]

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn: {position_xy: [0.0, 0.0]}
