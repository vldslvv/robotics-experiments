defaults:
  - config
  - _self_

# Runtime demonstration experiment: fly an absolute-waypoint navigation routine
# headless on the live runtime extension, for a single PX4-backed hexacopter.
# Inherits the default runtime config.yaml (sim/switches/px4/isaac_lab + the
# warehouse scene) but swaps the one fleet vehicle to the hexacopter_s550.usda
# asset. The shared airframe config supplies the six-rotor PX4 bridge arrays and
# the matching generic hexarotor-x SITL airframe (PX4_SIM_MODEL=none_hexa_x,
# PX4_SYS_AUTOSTART=6001).
#
# After takeoff the drone streams OFFBOARD position setpoints to each absolute
# world-ENU `goto` waypoint (yawing toward the leg), holds a stable hover, then
# lands. Runs forgivingly here (a flight-envelope breach logs and stops the
# routine, leaving manual control available).
#
# Coordinates are world ENU metres (x=east, y=north, z=up). The waypoints below
# stay in open space near the spawn; raise `goto` `timeout_s` if PX4's cruise
# speed makes a leg slow.
#
# Run with: make run-all HYDRA_CONFIG=configs/runtime_hexacopter_navigate.yaml

routine:
  steps: []

vehicles:
  - id: 0
    ros: {namespace: /s550_01}
    spawn_xy: [0.0, -2.0]
    drone:
      usd_path: /isaac-sim/proj/isaac/assets/LightSwitchWarehouse/hexacopter_s550.usda
      prim_name: Hexacopter0
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 0.0
          y: 2.0
          z: 2.5
          timeout_s: 25.0
        - kind: goto
          x: 3.0
          y: 2.0
          z: 2.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
