          - {collective_thrust_normalized: 0.50, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.64, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
