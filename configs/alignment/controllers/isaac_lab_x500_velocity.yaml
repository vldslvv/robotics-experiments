          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.30], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.60], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
