alignment_id: x500-velocity-px4-v7
controller_id: isaac-lab-x500-velocity-v36
controller_schema_version: 6
backend: isaac-lab
experiment_config: configs/alignment_px4_x500_velocity.yaml
vehicle: x500_01
airframe: holybro_x500_v2.usda
image: vv-isaac-lab-custom
command_rate_hz: 20.0

command_interface:
  kind: body-flu-velocity-yaw-rate-v1
  dimension: 4
  frame: body-flu
  linear_scale_mps: 3.0
  yaw_rate_scale_radps: 1.5

settings:
  command_delay_s: 0.078
  kp_vel: [1.8, 1.8, 4.0]
  horizontal_velocity_error_gain_scale: 1.285714286
  horizontal_velocity_error_gain_start_mps: 0.10
  horizontal_velocity_error_gain_full_mps: 0.35
  ki_vel: [0.3, 0.3, 1.5]
  kd_vel: [0.375, 0.3, 0.0]
  # Pinned MPC_VEL_LP=0 disables the position controller's velocity low-pass.
  velocity_filter_hz: 10.0
  velocity_derivative_filter_hz: 1.0
  velocity_integral_limit_mps2: [2.0, 2.0, 4.0]
  # Physical collective fraction of the composed X500's maximum thrust. The
  # 2.3472 kg vehicle requires approximately 0.375 at standard gravity.
  hover_thrust_fraction: 0.375
  # PX4's normalized hover-thrust boundary. Schema 5 uses this value before
  # control allocation; the physical fraction above is legacy-only.
  hover_thrust_normalized: 0.595
  kp_att: [5.0, 5.0, 3.5]
  attitude_yaw_weight: 0.4015625
  kp_rate: [0.1875, 0.1875, 0.25]
  ki_rate: [0.30, 0.30, 0.15]
  kd_rate: [0.0015, 0.0015, 0.0]
  kff_rate: [0.0, 0.0, 0.025]
  # Legacy schemas convert the normalized rate PID output to physical torque.
  # Schema 5 sends normalized torque directly to the PX4 allocator.
  rate_output_scale_nm: [6.5, 6.5, 1.3]
  rate_derivative_filter_hz: 10.0
  rate_integral_limit_nm: [0.45, 0.45, 0.45]
  max_tilt_cmd_deg: 45.0
  min_collective_thrust_fraction: 0.12
  max_collective_thrust_fraction: 1.0
  horizontal_thrust_margin_fraction: 0.30
  thruster_tau_inc_s: 0.04
  thruster_tau_dec_s: 0.02
  thruster_max_thrust_rate_nps: 500.0

search:
  strategy: coarse-to-fine-beam-v3
  # The broad campaign identified a trace- and live-passing basin. Search only
  # its evidenced neighborhood, then recover precision with midpoint levels.
  beam_width: 32
  passes_per_stage: 1
  refinement_levels: 2
  min_refinement_survivors: 2
  # Candidate 4,257 is a second independently live-passing rate-loop seed.
  initial_settings:
    - attitude_yaw_weight: 0.5
      kd_rate: [0.003, 0.003, 0.0]
      rate_derivative_filter_hz: 30.0
      max_tilt_cmd_deg: 56.25

parameters:
  - field: command_delay_s
    stage: 1
    candidates: [0.072, 0.078, 0.084]
  - field: velocity_filter_hz
    stage: 1
    candidates: [10.0]
  - field: velocity_derivative_filter_hz
    stage: 1
    candidates: [0.8, 1.0, 1.2]
  - field: hover_thrust_normalized
    stage: 1
    candidates: [0.58, 0.59, 0.595, 0.60]
  - field: kp_vel
    stage: 1
    candidates:
      - [1.7, 1.7, 4.0]
      - [1.8, 1.8, 4.0]
      - [1.9, 1.9, 4.0]
  - field: horizontal_velocity_error_gain_scale
    stage: 1
    candidates: [1.214285714, 1.285714286, 1.357142857]
  - field: horizontal_velocity_error_gain_start_mps
    stage: 1
    candidates: [0.08, 0.10, 0.12]
  - field: horizontal_velocity_error_gain_full_mps
    stage: 1
    candidates: [0.30, 0.35, 0.40]
  - field: ki_vel
    stage: 1
    candidates:
      - [0.25, 0.25, 1.25]
      - [0.3, 0.3, 1.5]
      - [0.35, 0.35, 1.75]
  - field: velocity_integral_limit_mps2
    stage: 1
    candidates:
      - [1.5, 1.5, 3.0]
      - [2.0, 2.0, 4.0]
      - [2.5, 2.5, 5.0]
  - field: kd_vel
    stage: 1
    candidates:
      - [0.35, 0.275, 0.0]
      - [0.375, 0.3, 0.0]
      - [0.4, 0.325, 0.0]
  - field: kp_att
    stage: 2
    candidates:
      - [4.5, 4.5, 3.15]
      - [5.0, 5.0, 3.5]
      - [5.5, 5.5, 3.85]
  - field: attitude_yaw_weight
    stage: 2
    candidates: [0.35, 0.4015625, 0.45, 0.5]
  - field: kp_rate
    stage: 2
    candidates:
      - [0.16875, 0.16875, 0.225]
      - [0.1875, 0.1875, 0.25]
      - [0.20625, 0.20625, 0.275]
  - field: ki_rate
    stage: 2
    candidates:
      - [0.25, 0.25, 0.125]
      - [0.30, 0.30, 0.15]
      - [0.35, 0.35, 0.175]
  - field: rate_integral_limit_nm
    stage: 2
    candidates:
      - [0.40, 0.40, 0.40]
      - [0.45, 0.45, 0.45]
      - [0.50, 0.50, 0.50]
  - field: kd_rate
    stage: 2
    candidates:
      - [0.00075, 0.00075, 0.0]
      - [0.0015, 0.0015, 0.0]
      - [0.00225, 0.00225, 0.0]
      - [0.003, 0.003, 0.0]
  - field: kff_rate
    stage: 2
    candidates:
      - [0.0, 0.0, 0.025]
      - [0.025, 0.025, 0.025]
      - [0.0375, 0.0375, 0.0375]
      - [0.046, 0.046, 0.046]
      - [0.05, 0.05, 0.05]
  - field: rate_derivative_filter_hz
    stage: 2
    candidates: [10.0, 15.0, 20.0, 25.0, 30.0]
  - field: max_tilt_cmd_deg
    stage: 2
    candidates: [45.0, 50.625, 56.25]
  - field: thruster_tau_inc_s
    stage: 3
    candidates: [0.04]
  - field: thruster_tau_dec_s
    stage: 3
    candidates: [0.02]
  - field: thruster_max_thrust_rate_nps
    stage: 3
    candidates: [500.0]

selection_metric: policy-execution-controller-quality-v3
publication_metrics:
  - velocity_rmse_mps
  - acceleration_rmse_mps2
  - worst_axis_velocity_nrmse
  - braking_distance_error_m
  - residual_speed_error_mps
  - stop_time_error_s
  - yaw_rate_nrmse
  - heading_error_deg
  - combined_endpoint_error_m

probes:
  - name: fit-forward-low-speed
    split: fit
    axis: x
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.10, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: fit-lateral-low-speed
    split: fit
    axis: y
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.10, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, -0.08, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: fit-vertical-low-speed
    split: fit
    axis: z
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.08], yaw_rate_radps: 0.0, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, -0.06], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: fit-yaw-steps
    split: fit
    axis: yaw
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.35, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.25, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: fit-combined-turns
    split: fit
    axis: combined
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.10, 0.0, 0.0], yaw_rate_radps: 0.30, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.10, 0.0], yaw_rate_radps: -0.30, duration_s: 1.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: validation-stage1-approach-brake
    split: validation
    axis: x
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.08, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: validation-lateral-ramp-reversal
    split: validation
    axis: y
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.05, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, 0.09, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, -0.06, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: validation-vertical-ramp-reversal
    split: validation
    axis: z
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.05], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.09], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, 0.0, -0.05], yaw_rate_radps: 0.0, duration_s: 0.75}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: validation-yaw-ramp-reversal
    split: validation
    axis: yaw
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.20, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.40, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.30, duration_s: 0.75}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: validation-combined-turns
    split: validation
    axis: combined
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.08, 0.0, 0.0], yaw_rate_radps: 0.25, duration_s: 1.25}
      - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
      - {velocity_body_flu_mps: [0.0, -0.08, 0.0], yaw_rate_radps: -0.35, duration_s: 1.25}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: stability-moderate-envelope
    split: stability
    axis: combined
    commands:
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.8, 0.0, 0.0], yaw_rate_radps: 0.6, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, -0.6, 0.3], yaw_rate_radps: -0.5, duration_s: 1.0}
      - {velocity_body_flu_mps: [-0.5, 0.0, -0.25], yaw_rate_radps: 0.0, duration_s: 1.0}
      - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
