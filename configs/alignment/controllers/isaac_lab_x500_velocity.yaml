      - [1.35, 1.575, 3.0]
      - [1.575, 1.575, 3.0]
      - [1.8, 1.8, 4.0]
      # The live gate passed at 1.8 forward gain and failed at the trace-only
      # 2.05 frontier. Intermediate points retain measured headroom.
      - [1.8, 1.35, 6.0]
      - [1.9, 1.35, 6.0]
      - [2.0, 1.35, 6.0]
      - [1.8, 2.25, 6.0]
