    stage: 1
    candidates: [0.0, 0.024, 0.048, 0.072, 0.096]
  - field: velocity_filter_hz
    stage: 1
    candidates: [10.0]
  - field: velocity_derivative_filter_hz
    stage: 1
    candidates: [0.5, 1.0, 2.5, 5.0, 7.5]
  - field: hover_thrust_normalized
    stage: 1
    candidates: [0.54, 0.56, 0.58, 0.60]
  - field: kp_vel
