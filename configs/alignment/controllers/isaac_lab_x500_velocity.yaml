alignment_id: x500-velocity-px4-v5
controller_id: isaac-lab-x500-velocity-v29
backend: isaac-lab
experiment_config: configs/alignment_px4_x500_velocity.yaml
vehicle: x500_01
airframe: holybro_x500_v2.usda
image: vv-isaac-lab-custom
command_rate_hz: 20.0

command_interface:
  kind: body-flu-velocity-yaw-rate-v1
  dimension: 4
  frame: body-flu
  linear_scale_mps: 3.0
  yaw_rate_scale_radps: 1.5

settings:
  command_delay_s: 0.060
  kp_vel: [1.35, 1.575, 3.0]
  ki_vel: [0.4, 0.4, 2.0]
  kd_vel: [0.3, 0.3, 0.0]
  # Pinned MPC_VEL_LP=0 disables the position controller's velocity low-pass.
  velocity_filter_hz: 5.0
  velocity_derivative_filter_hz: 1.0
  velocity_integral_limit_mps2: [1.0, 1.0, 2.0]
  # Physical collective fraction of the composed X500's maximum thrust. The
  # 2.3472 kg vehicle requires approximately 0.375 at standard gravity.
  hover_thrust_fraction: 0.375
  # PX4's normalized hover-thrust boundary. Schema 5 uses this value before
  # control allocation; the physical fraction above is legacy-only.
  hover_thrust_normalized: 0.57
  kp_att: [5.0, 5.0, 3.5]
  attitude_yaw_weight: 0.6
  kp_rate: [0.1875, 0.1875, 0.25]
  ki_rate: [0.30, 0.30, 0.15]
  kd_rate: [0.0, 0.0, 0.0]
  kff_rate: [0.025, 0.025, 0.025]
  # Legacy schemas convert the normalized rate PID output to physical torque.
  # Schema 5 sends normalized torque directly to the PX4 allocator.
  rate_output_scale_nm: [6.5, 6.5, 1.3]
  rate_derivative_filter_hz: 25.0
  rate_integral_limit_nm: [0.45, 0.45, 0.45]
  max_tilt_cmd_deg: 56.25
  min_collective_thrust_fraction: 0.12
  max_collective_thrust_fraction: 1.0
  horizontal_thrust_margin_fraction: 0.30
  thruster_tau_inc_s: 0.01
  thruster_tau_dec_s: 0.10
  thruster_max_thrust_rate_nps: 500.0

search:
  strategy: staged-beam-v2
  # The base settings are Attempt 18 candidate 6137, so its complete one-gate
  # combination is evaluated before staged replacements are pruned.
  beam_width: 32
  passes_per_stage: 2

parameters:
  - field: command_delay_s
    stage: 1
    candidates: [0.0, 0.024, 0.036, 0.048, 0.060, 0.072, 0.084, 0.096]
  - field: velocity_filter_hz
    stage: 1
    candidates: [0.0, 0.5, 1.0, 2.0, 5.0, 10.0]
  - field: velocity_derivative_filter_hz
    stage: 1
    candidates: [0.5, 0.625, 0.75, 0.875, 1.0, 2.5, 3.75, 5.0, 6.25, 7.5]
  - field: hover_thrust_normalized
    stage: 1
    candidates: [0.54, 0.55, 0.56, 0.57, 0.5715, 0.572, 0.58, 0.59, 0.60]
  - field: kp_vel
    stage: 1
    candidates:
      - [0.9, 0.9, 2.0]
      - [1.35, 1.35, 3.0]
      - [1.35, 1.575, 3.0]
      - [1.8, 1.8, 4.0]
      - [2.25, 2.25, 5.0]
      - [2.7, 2.7, 6.0]
      # Axis-separated candidates cover independently evidenced horizontal and
      # vertical bandwidth regions.
      - [1.8, 1.35, 6.0]
      - [1.8, 2.25, 6.0]
      - [1.8, 2.7, 6.0]
      - [1.575, 1.8, 3.0]
      - [1.575, 2.25, 3.0]
      - [1.8, 1.8, 3.0]
      - [1.8, 2.25, 3.0]
      - [1.8, 2.25, 4.0]
  - field: ki_vel
    stage: 1
