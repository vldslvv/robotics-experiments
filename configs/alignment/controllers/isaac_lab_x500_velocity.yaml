          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.30, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.60, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [-0.60, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.5}
      - name: validation-pitch-envelope
        split: validation
        axis: pitch
        commands:
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.30, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.60, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, -0.60, 0.0], duration_s: 0.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.5}
      - name: validation-yaw-envelope-ctbr
