alignment_id: x500-px4-v1
controller_id: isaac-lab-x500-v1
controller_schema_version: 1
backend: isaac-lab
experiment_config: configs/alignment_px4_x500_velocity.yaml
vehicle: x500_01
airframe: holybro_x500_v2.usda
image: vv-isaac-lab-custom
command_rate_hz: 20.0

settings:
  command_delay_s: 0.0
  velocity_controller_rate_hz: 125.0
  kp_vel: [1.8, 1.8, 4.20]
  horizontal_velocity_error_gain_scale: 1.0
  horizontal_velocity_error_gain_start_mps: 0.15
  horizontal_velocity_error_gain_full_mps: 0.30
  ki_vel: [0.4, 0.4, 2.1]
  kd_vel: [0.2, 0.2, 0.0]
  velocity_observation_scale: [0.98, 1.0425, 1.0]
  # Steady world-ENU physical-to-estimator offset measured from the reference.
  velocity_observation_bias_mps: [0.006, -0.030, 0.0]
  velocity_estimator_bias_decay_hz: 0.0
  velocity_filter_hz: 0.0
  velocity_derivative_filter_hz: 5.0
  velocity_integral_limit_mps2: [0.35, 0.35, 4.0]
  # PX4-normalized hover-thrust boundary used before control allocation.
  hover_thrust_normalized: 0.54
  kp_att: [4.0, 4.0, 2.8]
  attitude_yaw_weight: 0.4
  kp_rate: [0.15, 0.15, 0.20]
  ki_rate: [0.20, 0.20, 0.10]
  kd_rate: [0.003, 0.003, 0.0]
  kff_rate: [0.0, 0.0, 0.0]
  angular_velocity_filter_hz: 13.125
  rate_derivative_filter_hz: 20.0
  yaw_torque_filter_hz: 2.0
  rate_integral_limit: [0.30, 0.30, 0.30]
  max_tilt_cmd_deg: 45.0
  min_collective_thrust_fraction: 0.12
  max_collective_thrust_fraction: 1.0
  horizontal_thrust_margin_fraction: 0.30
  thruster_tau_inc_s: 0.04
  thruster_tau_dec_s: 0.02
  thruster_max_thrust_rate_nps: 100000.0

search:
  strategy: coarse-to-fine-beam
  # Evaluate broad, physically meaningful steps once, then generate midpoint
  # candidates only around retained candidates and per-gate champions.
  beam_width: 32
  passes_per_stage: 1
  refinement_levels: 2
  min_refinement_survivors: 2

parameters:
  # PX4's captured residual persisted across the fresh combined profile; fit
  # only the measured low-decay region and refine around its gate champions.
  - field: velocity_estimator_bias_decay_hz
    stage: 1
    candidates: [0.0, 0.0025, 0.005, 0.0075, 0.01, 0.0125]
  # Independent fresh captures occupy the evidenced X range from zero through
  # +0.035 m/s and the Y range from -0.030 through -0.005 m/s. Cover both at
  # large steps, then refine only around retained gate champions.
  - field: velocity_observation_bias_mps
    stage: 2
    # Once response gates pass, prefer the least estimator correction so the
    # aligned controller retains return-to-hover margin outside short probes.
    selection_regularization_scale: 1.0
    candidates:
      - [0.000, -0.030, -0.0039]
      - [0.000, -0.020, -0.0039]
      - [0.000, -0.010, -0.0039]
      - [0.000, 0.000, -0.0039]
      - [0.000, 0.010, -0.0039]
      - [0.010, -0.030, -0.0039]
      - [0.010, -0.020, -0.0039]
      - [0.010, -0.010, -0.0039]
      - [0.010, 0.000, -0.0039]
      - [0.010, 0.010, -0.0039]
      - [0.020, -0.030, -0.0039]
      - [0.020, -0.020, -0.0039]
      - [0.020, -0.010, -0.0039]
      - [0.020, 0.000, -0.0039]
      - [0.020, 0.010, -0.0039]
      - [0.030, -0.030, -0.0039]
      - [0.030, -0.020, -0.0039]
      - [0.030, -0.010, -0.0039]
      - [0.030, 0.000, -0.0039]
      - [0.030, 0.010, -0.0039]
      - [0.040, -0.030, -0.0039]
      - [0.040, -0.020, -0.0039]
      - [0.040, -0.010, -0.0039]
      - [0.040, 0.000, -0.0039]
      - [0.040, 0.010, -0.0039]
  # Short alignment profiles remain below this evidenced cap, while the longer
  # published-artifact goto is prevented from retaining excessive integral
  # acceleration. Keep it declarative so fit and runtime share the same limit.
  - field: velocity_integral_limit_mps2
    stage: 3
    candidates:
      - [0.35, 0.35, 4.0]

selection_metric: controller-quality
publication_metrics:
  - velocity.x_velocity_nrmse
  - velocity.y_velocity_nrmse
  - velocity.z_velocity_nrmse
  - velocity.x_envelope_velocity_nrmse
  - velocity.y_envelope_velocity_nrmse
  - velocity.z_envelope_velocity_nrmse
  - ctbr.roll_body_rate_nrmse
  - ctbr.pitch_body_rate_nrmse
  - ctbr.yaw_body_rate_nrmse
  - ctbr.collective_velocity_nrmse
  - ctbr.collective_acceleration_nrmse

probe_families:
  - name: velocity
    control_mode: velocity
    metric: translational-controller-quality
    profiles:
      - name: fit-forward-low-speed
        split: fit
        axis: x
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.10, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: fit-lateral-low-speed
        split: fit
        axis: y
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.10, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, -0.08, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: fit-vertical-low-speed
        split: fit
        axis: z
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.08], yaw_rate_radps: 0.0, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, -0.06], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: fit-yaw-steps
        split: fit
        axis: yaw
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.35, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.25, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: fit-combined-turns
        split: fit
        axis: combined
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.10, 0.0, 0.0], yaw_rate_radps: 0.30, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.10, 0.0], yaw_rate_radps: -0.30, duration_s: 1.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-stage1-approach-brake
        split: validation
        axis: x
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.08, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-lateral-ramp-reversal
        split: validation
        axis: y
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.05, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.09, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, -0.06, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-vertical-ramp-reversal
        split: validation
        axis: z
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.05], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.09], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, -0.05], yaw_rate_radps: 0.0, duration_s: 0.75}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-x-envelope
        split: validation
        axis: x
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.40, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.80, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [-0.80, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-y-envelope
        split: validation
        axis: y
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.40, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.80, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, -0.80, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-z-envelope
        split: validation
        axis: z
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.40], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.80], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, -0.80], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-yaw-ramp-reversal
        split: validation
        axis: yaw
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.20, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.40, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.30, duration_s: 0.75}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: validation-combined-turns
        split: validation
        axis: combined
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.08, 0.0, 0.0], yaw_rate_radps: 0.25, duration_s: 1.25}
          - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
          - {velocity_body_flu_mps: [0.0, -0.08, 0.0], yaw_rate_radps: -0.35, duration_s: 1.25}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
      - name: stability-moderate-envelope
        split: stability
        axis: combined
        commands:
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.8, 0.0, 0.0], yaw_rate_radps: 0.6, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, -0.6, 0.3], yaw_rate_radps: -0.5, duration_s: 1.0}
          - {velocity_body_flu_mps: [-0.5, 0.0, -0.25], yaw_rate_radps: 0.0, duration_s: 1.0}
          - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
  - name: ctbr
    control_mode: ctbr
    metric: ctbr-controller-quality
    profiles:
      - name: fit-roll-steps
        split: fit
        axis: roll
        commands:
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.35, 0.0, 0.0], duration_s: 1.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [-0.25, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.5}
      - name: fit-pitch-steps
        split: fit
        axis: pitch
        commands:
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.35, 0.0], duration_s: 1.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, -0.25, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.5}
      - name: fit-yaw-steps-ctbr
        split: fit
        axis: yaw
        commands:
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.35], duration_s: 1.5}
          - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
