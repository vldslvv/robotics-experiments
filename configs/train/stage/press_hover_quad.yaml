# @package _global_
defaults:
  - /base
  - /experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - _self_

# Press-hover task: target-local measured-envelope hold.
scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"

rl:
  episode_length_s: 40.0
  num_envs: 4096
  inputs:
    controller_artifact: .build/alignment/x500-px4-v1/20260912T211745Z/controller.json
    flight_parameters_artifact: .build/flight-parameters/holybro-x500-v2-hover-v1/20260912T102640Z
  action:
    max_body_velocity_mps: 0.5
  press:
    reward:
      hover_stabilization: boundary_weighted
      stabilization_weight: 0.01
      outside_envelope_weight: 0.03
      action_effort_weight: 1.0
      terminal_failure_weight: 30.0
    task: hover
    policy:
      normalize_observations: true
      actor:
        initial_noise_std: 0.10
  training:
    phases:
      - max_iterations: 50
        evaluation_interval: 5
        learning_rate: 0.0003
        schedule: fixed
        entropy_coef: 0.0
        update_observation_normalization: true
      - max_iterations: 100
        evaluation_interval: 5
        learning_rate: 1.0e-05
        schedule: fixed
        entropy_coef: 0.0
        update_observation_normalization: false
    plateau:
      metric_name: episode_longest_hover_duration_mean_s
      direction: maximize
      minimum_delta: 0.01
      patience_evaluations: 5
    task_id: Isaac-Switch-Press-Direct-v1
    vehicle_id: 0
    evaluation_worker_timeout_s: 600.0
    telemetry_sample_interval_s: 1.0
    gpu_utilization_target_rate: 0.95
    num_steps_per_env: 256
    gamma: 0.995
    lam: 0.99
    clip_param: 0.2
    value_loss_coef: 1.0
    num_learning_epochs: 4
    num_mini_batches: 8
    desired_kl: 0.01
    max_grad_norm: 1.0
    attempt_seeds: [42]

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn: {position_xy: [0.0, 0.0]}
