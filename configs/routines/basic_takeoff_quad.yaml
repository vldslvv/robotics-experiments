# @package _global_
defaults:
  - /base
  - /experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - override /experiment/routine@vehicles.x500_01.routine: takeoff
  - _self_

# Single-drone PX4 arm/takeoff/hover experiment using the shared `takeoff`
# routine and minimal scene. Live and strict runs perform landing recovery
# after a failure; strict runs then raise the preserved failure.
scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn: {position_xy: [0.0, 0.0]}
