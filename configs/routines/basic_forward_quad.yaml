# @package _global_
defaults:
  - /routines/basic_takeoff_quad
  - _self_

# Runtime demonstration experiment: arm, take off, hold hover, move forward
# along world +X/east, then land. On failure, the live runtime logs the cause
# and performs landing recovery before retaining the terminal failure.
#
# Run with: make run-all HYDRA_CONFIG=configs/routines/basic_forward_quad.yaml

scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

vehicles:
  x500_01:
    spawn: {position_xy: [0.0, -2.0], prim_name: Drone0}
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.0
          min_climb_m: 1.2
        - kind: hover
          hold_s: 2.0
        - kind: forward
          distance_m: 5.0
          timeout_s: 20.0
        - kind: land
          timeout_s: 30.0
