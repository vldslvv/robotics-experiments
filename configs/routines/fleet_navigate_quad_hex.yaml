# @package _global_
defaults:
  - /routines/basic_takeoff_quad
  - /experiment/vehicle@vehicles.s550_01: hexacopter_s550
  - _self_

# Dual-PX4 multi-drone absolute-waypoint navigation experiment. A quad (id 0,
# x500) and a hexacopter (id 1, hexacopter_s550) each fly the full nav routine
# (arm -> takeoff -> hover -> guided goto -> hover -> OFFBOARD goto -> hover ->
# land) at the same time,
# driven by the shared multi-PX4 launch path. Each PX4 SITL container uses the
# per-asset airframe derived from its USD asset.
#
# Parallel-lane waypoints: the two drones never converge. Each drone's absolute
# world-ENU goto legs are offset by its spawn x (quad lane x in {0,3}, hex lane
# x in {4,7}), so they fly the same relative path 4m apart. Coordinates
# are world ENU metres (x=east, y=north, z=up).
#
# Run with:
#   make test-integration-px4-navigation
#   make run-all HYDRA_CONFIG=configs/routines/fleet_navigate_quad_hex.yaml

vehicles:
  x500_01:
    spawn: {position_xy: [0.0, -2.0], prim_name: Drone0}
    routine:
      hover_settle_s: 3.0
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 3.0
          y: -2.0
          z: 2.5
          ground_speed_m_s: 0.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 3.0
          y: 1.0
          z: 2.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
  s550_01:
    id: 1
    ros: {namespace: /s550_01}
    spawn:
      position_xy: [4.0, -2.0]
      prim_name: Hexacopter0
    routine:
      hover_settle_s: 3.0
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 7.0
          y: -2.0
          z: 2.5
          ground_speed_m_s: 0.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 7.0
          y: 1.0
          z: 2.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
