# @package _global_
defaults:
  - /routines/basic_takeoff_quad
  - override /experiment/routine@vehicles.x500_01.routine: policy_press_approach
  - override /experiment/switches/model@switches.model: easy
  - _self_

# Single-drone terminal-approach deployment flight in the real warehouse.
scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

switches:
  num_switches: 1
  spawn_seed: 0
  spawn_bounds:
    - min: [0.0, 17.99, 2.5]
      max: [0.0, 17.99, 2.5]

vehicles:
  x500_01:
    spawn:
      position_xy: [0.0, 14.0]

rl:
  episode_length_s: 45.0
  press:
    task: approach
    reset:
      mix:
        - source: measured_navigation_handoff
          weight: 0.8
        - source: pinned_flight_parameters
          weight: 0.2
