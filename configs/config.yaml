defaults:
  - base_env
  # Group building blocks live under the experiment/ subdir; @<pkg> maps each
  # back onto its EnvConfig package (e.g. experiment/sim -> cfg.sim).
  - experiment/sim@sim: default
  - experiment/drone@drone: default
  - experiment/switches@switches: default
  - experiment/px4@px4: default
  - experiment/isaac_lab@isaac_lab: default
  - experiment/routine@routine: default
  - _self_

# Scene loaded for this experiment. Every experiment (test or not) sets a scene;
# '@' is repo-relative. This default runtime experiment carries no
# integration_test harness group (EnvConfig.integration_test stays None) -- the
# integration_test_* experiments add it.
scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

# Multi-vehicle scaffolding. Each entry merges its drone/px4 over the global
# drone/px4 defaults above. One entry = today's single-drone behavior; an empty
# list is a valid empty fleet. Add entries (distinct id, prim_name, spawn_xy) to
# add drones. id is the single authored identity: the MAVLink port
# (4560 + id), the PX4 -i index, and the per-vehicle log token are all derived
# from it. An omitted drone/px4 means "use the global defaults".
vehicles:
  - id: 0
    spawn_xy: [0.0, 0.0]

# Two-vehicle example (commented). The second vehicle uses a different asset and
# prim, its own derived MAVLink port (4560 + id = 4561), and a separate spawn:
#
# vehicles:
#   - id: 0
#     spawn_xy: [0.0, 0.0]
#   - id: 1
#     spawn_xy: [2.0, 0.0]
#     drone: {usd_path: /isaac-sim/proj/assets/other_drone.usda, prim_name: Drone1}
