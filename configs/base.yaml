defaults:
  - base_experiment
  - experiment/sim@sim: default
  - experiment/switches@switches: default
  - experiment/rl@rl: default
  - experiment/driver@driver: default
  - _self_

rates:
  command_rate_hz: 20.0
  sample_rate_hz: ${rates.command_rate_hz}

flight_parameters: null

flight_benchmark:
  airborne_duration_s: 5.0

alignment:
  dataset_split:
    train_percent: 80.0
    validation_percent: 10.0
  evaluation:
    hover_position_margin_m: 0.005
    hover_attitude_margin_rad: 0.004363323129985824
    live_limits:
      live.hover_error_m: 0.1
      live.goto_error_m: 0.2
    response_limits:
      velocity.x_velocity_nrmse: 0.1
      velocity.x_envelope_velocity_nrmse: 0.1
      velocity.x_braking_distance_error_m: 0.005
      velocity.x_residual_speed_error_mps: 0.01
      velocity.x_stop_time_error_s: 0.1
      velocity.y_velocity_nrmse: 0.1
      velocity.y_envelope_velocity_nrmse: 0.1
      velocity.y_braking_distance_error_m: 0.005
      velocity.y_residual_speed_error_mps: 0.01
      velocity.y_stop_time_error_s: 0.1
      velocity.z_velocity_nrmse: 0.1
      velocity.z_envelope_velocity_nrmse: 0.1
      velocity.z_braking_distance_error_m: 0.005
      velocity.z_residual_speed_error_mps: 0.01
      velocity.z_stop_time_error_s: 0.1
      velocity.combined_endpoint_error_m: 0.01
      ctbr.roll_body_rate_nrmse: 0.1
      ctbr.roll_envelope_body_rate_nrmse: 0.1
      ctbr.roll_attitude_error_deg: 3.0
      ctbr.pitch_body_rate_nrmse: 0.1
      ctbr.pitch_envelope_body_rate_nrmse: 0.1
      ctbr.pitch_attitude_error_deg: 3.0
      ctbr.yaw_body_rate_nrmse: 0.1
      ctbr.yaw_envelope_body_rate_nrmse: 0.1
      ctbr.yaw_attitude_error_deg: 3.0
      ctbr.collective_velocity_nrmse: 0.1
      ctbr.collective_acceleration_nrmse: 0.1
  capture:
    sensor_seed: 42
    # Match the plant used by press-policy training and deployment.
    pusher_deployed: true
    minimum_neutral_s: 3.0
    stable_hold_s: 0.5
    timeout_s: 12.0
    # Return to the routine's hover reference between independent profiles so
    # suite order cannot accumulate displacement against the safety envelope.
    recenter_gain_hz: 1.0
    recenter_max_speed_mps: 0.8
    max_linear_speed_mps: 0.02
    max_angular_speed_radps: 0.03
    max_tilt_deg: 0.25
  execution:
    worker_count: 1
    # Candidate settings per fixed Isaac scene. Larger beam expansions are
    # chunked through this persistent scene instead of inflating every batch.
    candidate_capacity: 128
    candidate_capacity_benchmark: [128, 256, 384, 512]
    gpu_target_percent: 95.0
    gpu_sample_interval_s: 0.5
