name: quadcopter_500mm
output_filename: quadcopter_500mm.usda
prim_name: quadcopter

total_mass: 1.5
diagonal_inertia: [0.0347, 0.0458, 0.0977]
center_of_mass: [0.0, 0.0, 0.01]

center_plate:
  name: S500-class carbon center plate
  size: [0.12, 0.12, 0.006]
  position: [0.0, 0.0, 0.0]
  mass: 0.350

# Geometry of one arm, authored once and shared by every arm. All positions are
# in the arm-local frame: +X points outboard along the boom, and the per-arm
# heading lives on the arm placement (azimuth_deg) below. The ESC therefore needs
# no rotation -- its long (X) axis is already along the boom -- and the motor/prop
# sit at the boom tip (radial = boom.length).
arm_geometry:
  boom:
    name: S500-class carbon-fiber boom
    radius: 0.008
    length: 0.3535533905932738
  motor:
    name: X2212-class brushless motor
    radius: 0.015
    height: 0.03
    position: [0.3535533905932738, 0.0, 0.02]
    mass: 0.057
  esc:
    name: BLHeli_S 20A ESC
    size: [0.025, 0.015, 0.004]
    position: [0.21213203435596426, 0.0, 0.005]
    mass: 0.007
  propeller:
    name: 9045 propeller
    radius: 0.1143
    height: 0.002
    position: [0.3535533905932738, 0.0, 0.04]
    mass: 0.008
    num_blades: 2

# One placement per physical arm: the sole heading source (azimuth_deg) plus the
# motor identity (spin direction and PX4 motor index). Generic Quad X order.
arms:
  - name: M1 FR CCW
    azimuth_deg: 45.0
    spin_dir: CCW
    px4_motor_index: 2
  - name: M2 FL CW
    azimuth_deg: 135.0
    spin_dir: CW
    px4_motor_index: 1
  - name: M3 RL CCW
    azimuth_deg: -135.0
    spin_dir: CCW
    px4_motor_index: 3
  - name: M4 RR CW
    azimuth_deg: -45.0
    spin_dir: CW
    px4_motor_index: 0

pixhawk:
  name: Pixhawk 6C
  size: [0.050, 0.038, 0.016]
  position: [0.0, 0.0, 0.008]
  mass: 0.035

jetson:
  name: Jetson Orin Nano Super
  size: [0.100, 0.080, 0.030]
  position: [-0.03, 0.0, 0.015]
  mass: 0.165

realsense:
  name: Intel RealSense D435i
  size: [0.090, 0.025, 0.025]
  position: [0.07, 0.0, 0.01]
  mass: 0.072
  rotation_deg: [0.0, -15.0, 0.0]

optical_flow:
  name: PMW3901 optical flow
  size: [0.020, 0.020, 0.005]
  position: [0.0, 0.0, -0.06]
  mass: 0.005
  rotation_deg: [180.0, 0.0, 0.0]

lidar:
  name: Slamtec RPLiDAR A2
  radius: 0.038
  height: 0.041
  position: [0.0, 0.0, 0.0205]
  mass: 0.190

battery:
  name: 4S 5000 mAh LiPo
  size: [0.140, 0.045, 0.025]
  position: [0.0, 0.0, -0.03]
  mass: 0.300

wiring:
  name: PDB + power module
  size: [0.050, 0.030, 0.010]
  position: [0.0, 0.0, 0.0]
  mass: 0.100

# Compliant pusher appendage. `enabled` is the per-drone on/off switch: set it
# false to build this airframe without the pusher (the geometry/drive below stay
# defined for an easy re-enable). The pad is a sibling rigid body linked to the
# body by a spring-damper prismatic joint (`pusher_joint`).
pusher:
  enabled: true
  pad:
    name: Spring-loaded pusher pad
    radius: 0.015
    height: 0.008
    position: [0.11, 0.0, 0.01]
    mass: 0.040
  drive:
    travel: 0.015
    stiffness: 800.0
    damping: 40.0
