defaults:
  - config
  - override experiment/routine@routine: takeoff
  - _self_

# Single-drone PX4 arm/takeoff/hover experiment. Identical in shape to the
# runtime config: it selects the same `takeoff` routine (steps + flight-envelope
# gates) and only overrides the scene to the minimal integration stage. There is
# no separate test-harness config -- "integration test" just means running this
# config standalone in strict mode (the make target passes --strict), so a
# flight-envelope breach fails the process; `make run-all` runs it forgivingly.
scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"
