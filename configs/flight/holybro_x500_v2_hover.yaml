schema_version: 1
flight_parameters_id: holybro-x500-v2-hover-v1
source_backend: px4-sitl
state_source: simulator-ground-truth
experiment_config: configs/flight_parameters_x500_hover.yaml
vehicle: x500_01
sets:
  fit:
    hover_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
                  1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020,
                  1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030]
    response_seeds: [1101]
  validation:
    hover_seeds: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010]
    response_seeds: [2101]
  acceptance:
    hover_seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010]
    response_seeds: [3101]
hover:
  kind: hover
  mode_transition_timeout_s: 15.0
  mode_report_max_age_s: 2.5
  settle_s: 6.0
  measure_s: 30.0
  sample_rate_hz: 20.0
  target_position_enu_m: [0.0, 0.0, 2.5]
  target_yaw_rad: 0.0
response:
  kind: controller-response
  experiment_config: configs/alignment_px4_x500_velocity.yaml
  definition: configs/alignment/controllers/px4_sitl_x500_velocity.yaml
# Policy qualification evaluates the final 24 seconds. Alignment continues to
# use every sample in the full 30-second hold trace.
policy_warmup_s: 6.0
position_margin_m: 0.005
attitude_margin_rad: 0.004363323129985824
execution:
  # Each trial owns fresh PX4 and Isaac processes. Keep one worker on the
  # single-GPU development machine; the campaign runner retains ordered trial
  # identities so this can be raised on suitable hardware.
  worker_count: 1
