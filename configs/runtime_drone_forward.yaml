defaults:
  - config
  - _self_

# Runtime demonstration experiment: fly the shared arm -> takeoff -> hover
# routine (with flight-envelope verification) headless on the live drone_spawner
# extension. Inherits the default runtime config.yaml (sim/drone/switches/px4/
# press + its 1-vehicle fleet and warehouse scene) and selects the `takeoff`
# routine variant. The same routine the integration test asserts in strict mode;
# here it runs forgivingly (a breach logs and stops the routine, leaving manual
# control available).
#
# Run with: make run-all HYDRA_CONFIG=configs/runtime_arm_takeoff.yaml

routine:
  steps: []

vehicles:
  - id: 0
    ros: {namespace: /x500_01}
    spawn_xy: [0.0, -2.0]
    drone: {prim_name: Drone0}
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.0
          min_climb_m: 1.2
        - kind: hover
          hold_s: 2.0
        - kind: forward
          distance_m: 5.0
          timeout_s: 20.0
        - kind: land
          timeout_s: 30.0
