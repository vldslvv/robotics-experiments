defaults:
  - config
  - _self_

# Runtime demonstration experiment: the live drone_spawner extension flies an
# arm -> takeoff routine headless on Play, without any integration-test harness.
# Inherits the default runtime config.yaml (sim/drone/switches/px4/isaac_lab/
# routine + its 1-vehicle fleet) and overrides only routine.steps so the control
# driver is built (an empty routine.steps, as in config.yaml, stays manual).
#
# Run with: make run-all HYDRA_CONFIG=configs/runtime_arm_takeoff.yaml
routine:
  steps:
    - kind: arm
    - kind: takeoff
      climb_m: 1.5
