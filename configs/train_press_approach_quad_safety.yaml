defaults:
  - train_press_approach_quad
  - _self_

# Phase 2 resumes the complete scratch PPO state and concentrates updates near
# the independently evidenced range boundary. Evaluation remains on the full
# handoff distribution inherited from the base experiment.
rl:
  press:
    training_reset:
      # A minority hard-case stream corrects undershoot without overwhelming
      # the full-distribution approach behavior learned during scratch.
      hard_case_fraction: 0.1
  training:
    training_mode: resume
    # Eleven runner iterations bound the safety search; every update is saved
    # so selection can resolve the narrow safe/timeout transition.
    max_iterations: 11
    save_interval: 1
    learning_rate: 3.0e-5
    schedule: fixed
    entropy_coef: 0.0
