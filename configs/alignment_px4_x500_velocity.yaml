defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - _self_

scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn: {position_xy: [0.0, 0.0]}
    bridge:
      # Alignment compares deterministic controller and plant response. Noisy
      # estimator inputs are a separate sim-to-real diagnostic.
      sensor_noise_enabled: false
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: policy
          label: alignment-probes
          artifact: alignment-probe
          timeout_s: 150.0
