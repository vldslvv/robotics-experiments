defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - _self_

scene: "@isaac/assets/TestScenes/MinimalIntegration.usda"

sim:
  enhanced_determinism: true

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn: {position_xy: [0.0, 0.0]}
    bridge:
      # Isolate controller/plant alignment from stochastic IMU/GPS inputs.
      # PX4 still requires nonconstant pressure samples to keep its barometer
      # instance healthy.
      sensor_noise_enabled: false
      sensor_excitation_mode: deterministic
      barometer_noise_std_pa: 0.1
      # PX4's exact-field innovation is outside its initialization gate, so
      # retain a small deterministic magnetic excitation.
      magnetometer_noise_scale: 0.1
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: policy
          label: alignment-probes
          artifact: alignment-probe
          timeout_s: 150.0
