defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - override experiment/routine@vehicles.x500_01.routine: policy_press
  - _self_

# Single-drone F3 deployment sanity flight in the real warehouse. This
# diagnostic config faithfully matches the current legacy artifact. Future
# artifacts trained with a different action scale must update this value in the
# same change that promotes the artifact.
scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

switches:
  num_switches: 1
  spawn_seed: 0
  press_threshold: 0.005
  spawn_bounds:
    - min: [0.0, 17.99, 2.5]
      max: [0.0, 17.99, 2.5]

rl:
  action:
    max_body_velocity_mps: 0.5

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn:
      position_xy: [0.0, 14.0]
      yaw_rad: 0.0
