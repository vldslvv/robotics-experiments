      kind: "controller-response"
      control_mode: "ctbr"
      axis: "pitch"
      hold_position: false
      commands:
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.3, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.6, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, -0.6, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, -0.3, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
    - name: validation-yaw-envelope-ctbr
      kind: "controller-response"
      control_mode: "ctbr"
      axis: "yaw"
      hold_position: false
      commands:
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.3], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.6], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, -0.6], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, -0.3], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
    - name: validation-collective-envelope
      kind: "controller-response"
      control_mode: "ctbr"
      axis: "collective"
      hold_position: false
      commands:
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
        - {collective_thrust_normalized: 0.5, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.5}
