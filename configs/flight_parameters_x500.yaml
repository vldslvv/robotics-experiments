        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.35, 0.0], duration_s: 0.3}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.2}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, -0.35, 0.0], duration_s: 0.3}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.7}
    - name: fit-yaw-steps-ctbr
      kind: "controller-response"
      control_mode: "ctbr"
      axis: "yaw"
      hold_position: false
      commands:
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 1.0}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.35], duration_s: 0.3}
        - {collective_thrust_normalized: 0.57, body_rate_flu_radps: [0.0, 0.0, 0.0], duration_s: 0.2}
