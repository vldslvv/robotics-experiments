      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.05], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.09], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, -0.05], yaw_rate_radps: 0.0, duration_s: 0.75}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-x-envelope
      kind: "controller-response"
      control_mode: "velocity"
      axis: "x"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.4, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.8, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [-0.8, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-y-envelope
      kind: "controller-response"
      control_mode: "velocity"
      axis: "y"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.4, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.8, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, -0.8, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-z-envelope
      kind: "controller-response"
      control_mode: "velocity"
      axis: "z"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.4], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.8], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, -0.8], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-yaw-ramp-reversal
      kind: "controller-response"
      control_mode: "velocity"
      axis: "yaw"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.2, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.4, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.3, duration_s: 0.75}
