defaults:
  - experiment/calibration/x500
  - _self_

flight_parameters:
  schema_version: 1
  flight_parameters_id: holybro-x500-v2-hover-v1
  source_backend: px4-sitl
  state_source: simulator-ground-truth
  vehicle: x500_01
  start_seed: 1001
  flight_count: 10
  takeoff_min_climb_m: 1.5
  preparation:
    pusher_deployed: true
    minimum_neutral_s: 3.0
    stable_hold_s: 0.5
    timeout_s: 20.0
    recenter_gain_hz: 1.0
    recenter_max_speed_mps: 0.8
    max_linear_speed_mps: 0.02
    max_angular_speed_radps: 0.03
    max_tilt_deg: 0.25
  execution:
    worker_count: 1
    gzip_level: 6
    minimum_free_bytes: 5368709120
    # Raw producer/harness copies and compression staging per worker.
    raw_flight_budget_bytes: 1073741824
    estimated_archive_bytes_per_flight: 105000000
  stages:
    - name: hover
      kind: "hover"
      control_mode: "auto-loiter"
      axis: "pose"
      hold_position: true
      hover:
        kind: "hover"
        mode_transition_timeout_s: 15.0
        mode_report_max_age_s: 2.5
        settle_s: 6.0
        measure_s: 30.0
        target_position_enu_m: [0.0, 0.0, 2.5]
        target_yaw_rad: 0.0
      commands: []
    - name: fit-forward-low-speed
      kind: "controller-response"
      control_mode: "velocity"
      axis: "x"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.1, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: fit-lateral-low-speed
      kind: "controller-response"
      control_mode: "velocity"
      axis: "y"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.1, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, -0.08, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: fit-vertical-low-speed
      kind: "controller-response"
      control_mode: "velocity"
      axis: "z"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.08], yaw_rate_radps: 0.0, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, -0.06], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: fit-yaw-steps
      kind: "controller-response"
      control_mode: "velocity"
      axis: "yaw"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.35, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: -0.25, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: fit-combined-turns
      kind: "controller-response"
      control_mode: "velocity"
      axis: "combined"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.1, 0.0, 0.0], yaw_rate_radps: 0.3, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.1, 0.0], yaw_rate_radps: -0.3, duration_s: 1.5}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-stage1-approach-brake
      kind: "controller-response"
      control_mode: "velocity"
      axis: "x"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.08, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [-0.04, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-lateral-ramp-reversal
      kind: "controller-response"
      control_mode: "velocity"
      axis: "y"
      hold_position: false
      commands:
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.05, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, 0.09, 0.0], yaw_rate_radps: 0.0, duration_s: 1.0}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 0.5}
        - {velocity_body_flu_mps: [0.0, -0.06, 0.0], yaw_rate_radps: 0.0, duration_s: 0.75}
        - {velocity_body_flu_mps: [0.0, 0.0, 0.0], yaw_rate_radps: 0.0, duration_s: 1.5}
    - name: validation-vertical-ramp-reversal
      kind: "controller-response"
      control_mode: "velocity"
