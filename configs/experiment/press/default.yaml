defaults:
  - base_press

# Isaac Lab press-training scale. Replaces the retired `isaac_lab` group.
# The physics decimation is derived in the env as round(sim.physics_hz /
# policy_rate_hz) (250 / 50 = 5), so the physics cadence stays single-sourced
# on sim.physics_hz.
num_envs: 16
env_spacing: 4.0
episode_length_s: 5.0
policy_rate_hz: 50.0

# Pluggable RL action level. `kind` selects the in-Lab actuation model
# (velocity | ctbr); switching is a one-line edit. Gains are a superset covering
# both models; the validation gate (make test-integration-press-hover-goto)
# tunes them against the airframe.
action:
  kind: velocity
  action_dim: 4
  max_body_velocity_mps: 3.0
  max_yaw_rate_radps: 1.5
  max_body_rate_radps: 6.0
  max_tilt_cmd_deg: 30.0
  hover_thrust_fraction: 0.4
  controller_kp_vel: [2.0, 2.0, 3.0]
  controller_kd_vel: [1.2, 1.2, 1.5]
  controller_kp_att: [6.0, 6.0, 2.0]
  controller_kp_rate: [1.2, 1.2, 0.4]
