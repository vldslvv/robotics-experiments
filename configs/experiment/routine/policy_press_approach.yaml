defaults:
  - default

# Stop at a safe staging point before the short move to the 0.47 m actor-entry
# target. Its 0.02 m position tolerance keeps the complete axial waypoint band
# inside the training handoff range of 0.45-0.50 m. The long navigation leg must
# not use the handoff point as its braking target because PX4 position-control
# overshoot can consume the pusher-to-wall clearance.
takeoff_timeout_s: 20.0

steps:
  - kind: arm
  - kind: takeoff
    climb_m: 2.5
    min_climb_m: 1.5
  - kind: hover
    hold_s: 2.0
  - kind: goto
    x: 0.0
    y: 17.40
    z: 2.5
    ground_speed_m_s: 0.5
    position_tol_m: 0.05
    timeout_s: 20.0
  - kind: hover
    hold_s: 2.0
  - kind: goto
    x: 0.0
    y: 17.52
    z: 2.5
    ground_speed_m_s: 0.08
    position_tol_m: 0.02
    timeout_s: 10.0
  - kind: hover
    hold_s: 2.0
  - kind: policy
    label: press-approach
    # `latest` is the active operator deployment and is not itself an
    # acceptance claim; inspect the originating campaign report when needed.
    artifact: .build/training/press-approach/latest
    switch_index: 0
    timeout_s: 20.0
  - kind: goto
    x: 0.0
    y: 14.0
    z: 2.5
    ground_speed_m_s: 0.5
    position_tol_m: 0.15
    timeout_s: 20.0
  - kind: land
    timeout_s: 20.0
