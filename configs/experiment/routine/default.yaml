defaults:
  - base_routine

# High-level flight routine flown in every workflow. `steps` is the single source
# of truth and the on/off switch: an empty list (the default) means purely manual
# operation -- no control driver is built and you fly each drone from its PX4
# console. A non-empty `steps` (see the `takeoff` routine variant) makes the live
# extension (`make run-all`), a regular standalone run, and a strict standalone
# run all arm/take-off/verify the fleet over each drone's derived gcs_port; only
# the reaction to a flight-envelope breach differs (strict raises, forgiving logs
# and stops).
steps: []

# Control-link and command-flow tunables (used only when steps is non-empty).
gcs_heartbeat_period_s: 0.5
command_ack_timeout_s: 10.0
# Wall-clock bound for the driver's explicit Land attempt and the independent
# PX4 offboard-loss fallback after any armed routine failure.
failure_recovery_timeout_s: 30.0
bridge_heartbeat_timeout_s: 12.0
handshake_timeout_s: 12.0
prearm_settle_s: 10.0
takeoff_target_timeout_s: 30.0
ground_settle_s: 1.5
takeoff_timeout_s: 30.0
hover_settle_s: 2.0

# Flight-envelope gates wired onto the takeoff/hover steps (private envelope-gate adapter).
# The continuous max_* gates fail the routine when breached; the hover_max_* bounds
# define a "stable hover" for the hover step's hold window. Horizontal gates sized
# from recent passing runs with generous headroom.
max_tilt_deg: 35.0
max_lateral_drift_m: 2.0
max_vertical_speed_m_s: 8.0
max_downward_speed_m_s: -4.0
max_angular_speed_rad_s: 8.0
hover_max_abs_vertical_speed_m_s: 0.35
hover_max_abs_horizontal_speed_m_s: 0.30

# Navigation (`goto`) tunables: how close/aligned counts as reached, the
# cross-track gate on the planned path, and how many OFFBOARD setpoints a
# speedless goto or policy streams before engaging the mode. A goto with an
# authored positive `ground_speed_m_s` instead uses PX4 guided repositioning.
goto_position_tol_m: 0.5
goto_heading_tol_deg: 25.0
goto_cross_track_m: 2.0
goto_offboard_prime_ticks: 30
