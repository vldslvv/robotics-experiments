defaults:
  - base_rl
  - press: default

# Shared Isaac Lab RL scale. The physics decimation is derived in the env as
# scheduled exactly from sim.physics_hz (250 / 20 alternates 13 and 12 physics
# steps), so the physics cadence stays single-sourced on sim.physics_hz.
num_envs: 16
env_spacing: 4.0
episode_length_s: 5.0
policy_rate_hz: 20.0

# Lab-only spawn/solver caps. Pusher stiffness and damping are inherited from
# the generated USD and therefore remain single-sourced in the airframe config.
lab_vehicle:
  spawn_height_m: 1.0
  max_linear_velocity_mps: 20.0
  max_angular_velocity_radps: 20.0
  max_depenetration_velocity_mps: 10.0
  pusher_effort_limit_n: 50.0
  pusher_velocity_limit_mps: 1.0

# PPO training (make train-rl, rl.training adapter). task_id selects the
# Gymnasium task the entrypoint trains.
training:
  task_id: Isaac-Drone-Hover-Direct-v0
  vehicle_id: 0
  policy_name: hover
  max_iterations: 1500
  num_steps_per_env: 24
  save_interval: 200
  learning_rate: 1.0e-3
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  clip_param: 0.2
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  desired_kl: 0.01
  max_grad_norm: 1.0
  init_noise_std: 1.0
  actor_hidden_dims: [128, 128]
  critic_hidden_dims: [128, 128]
  activation: elu
  seed: 42

# Pluggable RL action level. `kind` selects the in-Lab actuation model
# (velocity | ctbr); switching is a one-line edit. Gains are a superset covering
# both models; the validation gate (make test-integration-press-hover-goto)
# tunes them against the airframe.
action:
  kind: velocity
  action_dim: 4
  max_body_velocity_mps: 3.0
  max_yaw_rate_radps: 1.5
  max_body_rate_radps: 6.0
  max_tilt_cmd_deg: 30.0
  hover_thrust_fraction: 0.4
  controller_kp_vel: [2.0, 2.0, 3.0]
  controller_kd_vel: [1.2, 1.2, 1.5]
  controller_kp_att: [6.0, 6.0, 2.0]
  controller_kp_rate: [1.2, 1.2, 0.4]
