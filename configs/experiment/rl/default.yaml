defaults:
  - base_rl
  - press: approach

# Shared Isaac Lab RL scale. The physics decimation is derived in the env as
# scheduled exactly from sim.physics_hz (250 / 20 alternates 13 and 12 physics
# steps), so the physics cadence stays single-sourced on sim.physics_hz.
num_envs: 16
env_spacing: 4.0
episode_length_s: 5.0
policy_rate_hz: 20.0

# Lab-only spawn/solver caps. Pusher stiffness and damping are inherited from
# the generated USD and therefore remain single-sourced in the airframe config.
lab_vehicle:
  spawn_height_m: 1.0
  max_linear_velocity_mps: 20.0
  max_angular_velocity_radps: 20.0
  max_depenetration_velocity_mps: 10.0
  pusher_effort_limit_n: 50.0
  pusher_velocity_limit_mps: 1.0

# PPO training (make train-rl, rl.training adapter). task_id selects the
# Gymnasium task the entrypoint trains.
training:
  task_id: Isaac-Drone-Hover-Direct-v0
  vehicle_id: 0
  policy_name: hover
  training_mode: scratch
  controller_artifact: .build/alignment/x500-velocity-px4-v7/best
  max_iterations: 1500
  num_steps_per_env: 24
  save_interval: 200
  learning_rate: 1.0e-3
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  clip_param: 0.2
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  desired_kl: 0.01
  max_grad_norm: 1.0
  seed: 42

# Hover task definition and task-owned ActorCritic topology.
hover:
  policy:
    activation: elu
    actor:
      hidden_dims: [128, 128]
      initial_noise_std: 1.0
      output_initialization: scratch-neutral-output
    critic:
      hidden_dims: [128, 128]
  reward_pos_weight: 1.0
  reward_linvel_weight: 0.1
  reward_angvel_weight: 0.05
  reward_alive: 0.5
  crash_tilt_cos: 0.0
  min_altitude_m: 0.15
  max_position_error_m: 5.0
  reset_xy_half_m: 0.5
  reset_z_half_m: 0.3

# Task-neutral normalized policy-action contract. Controller and actuator
# settings come from the selected alignment artifact.
action:
  kind: velocity
  action_dim: 4
  max_body_velocity_mps: 3.0
  max_yaw_rate_radps: 1.5
  max_body_rate_radps: 6.0
  hover_thrust_fraction: 0.4
