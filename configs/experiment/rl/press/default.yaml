defaults:
  - base_press_task

# The hover task definition (Isaac-Drone-Hover-Direct-v0): reward weights,
# termination envelope, and reset randomization. Authoring this block IS the
# task definition; the env module carries no task-tuning literals.
hover_task:
  reward_pos_weight: 1.0
  reward_linvel_weight: 0.1
  reward_angvel_weight: 0.05
  reward_alive: 0.5
  crash_tilt_cos: 0.0
  min_altitude_m: 0.15
  max_position_error_m: 5.0
  reset_xy_half_m: 0.5
  reset_z_half_m: 0.3

# Nav -> contact handoff gate thresholds (rl.press.handoff_ready).
# Initial-column values from the ROADMAP1 handoff table; the mature column
# tightens them once the perception stack stabilizes.
handoff:
  pose_confidence_min: 0.85
  pose_age_max_s: 0.1
  switch_range_max_m: 0.50
  lateral_align_max_m: 0.08
  wall_normal_speed_max_mps: 0.15
  lateral_speed_max_mps: 0.20
  angular_speed_max_radps: 0.40
  estimator_health_min: 0.80

# Ground-truth F3 task. Penalty weights are positive and subtracted by the
# transition. Stability penalizes squared deviation from upright; generic
# contact is never a substitute for a confirmed latch.
reward:
  alive_weight: 0.0
  stability_weight: 5.0
  approach_progress_weight: 50.0
  gentle_contact_weight: 5.0
  compression_progress_weight: 200.0
  button_progress_weight: 200.0
  # Signed confirmation progress rewards an uninterrupted hold and cancels the
  # accumulated credit when the button is released before confirmation.
  latch_progress_weight: 30.0
  toggle_weight: 30.0
  retreat_progress_weight: 200.0
  retreat_alignment_weight: 50.0
  retreat_overspeed_weight: 50.0
  success_weight: 100.0
  action_energy_weight: 0.001
  action_delta_weight: 0.004
  contact_oscillation_weight: 0.2
  scraping_weight: 0.1
  misalignment_weight: 0.2
  failure_weight: 30.0
  timeout_weight: 25.0
  gentle_contact_speed_max_mps: 0.20
  compression_target_m: 0.010
  compression_overshoot_tolerance_m: 0.003
  misalignment_tolerance_m: 0.035

reset:
  button_geometry_scale: 1.5
  button_stiffness_scale: 0.5
  button_threshold_scale: 0.5
  switch_distance_from_env_origin_m: 0.40
  switch_wall_offset_m: 0.02
  switch_height_m: 1.0
  wall_half_extents_m: [0.05, 1.0, 1.0]
  wall_normal_min_m: 0.40
  wall_normal_max_m: 0.50
  lateral_error_min_m: -0.02
  lateral_error_max_m: 0.02
  vertical_error_min_m: -0.02
  vertical_error_max_m: 0.02
  initial_linear_velocity_max_mps: 0.0
  initial_angular_velocity_max_radps: 0.0

termination:
  crash_tilt_cos: 0.819152
  min_altitude_m: 0.25
  max_wall_normal_distance_m: 1.0
  max_lateral_error_m: 0.30
  max_vertical_error_m: 0.30
  # This is a minimum; success returns to the episode's initial wall-normal
  # range when that is farther away.
  retreat_distance_m: 0.35
  retreat_speed_max_mps: 0.20
  retreat_alignment_tolerance_m: 0.05
  retreat_angular_speed_max_radps: 0.50
  stable_retreat_steps: 5
  first_contact_speed_max_mps: 0.25
  first_contact_angular_speed_max_radps: 0.50

evaluation:
  seeds: [101, 202, 303]
  episodes_per_seed: 100
  success_rate_min: 0.80
  first_contact_stability_min: 0.85
  retreat_rate_min: 0.95

contact_force_threshold_n: 0.25
