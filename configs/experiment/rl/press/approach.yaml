defaults:
  - base_press_task

curriculum_stage: approach

# Press task-owned ActorCritic topology. The actor maps the 34-value
# schema-v1 observation to a four-value normalized action mean; the critic maps
# the same observation to one value estimate.
policy:
  activation: elu
  actor:
    hidden_dims: [256, 256, 128]
    initial_noise_std: 0.03
    output_initialization: scratch-neutral-output
  critic:
    hidden_dims: [256, 256, 128]

# Shared actor-entry envelope for Lab reset and live policy handoff.
handoff:
  pose_confidence_min: 0.85
  pose_age_max_s: 0.1
  switch_range_min_m: 0.44
  switch_range_max_m: 0.52
  lateral_align_max_m: 0.08
  wall_normal_speed_max_mps: 0.02
  lateral_speed_max_mps: 0.02
  angular_speed_max_radps: 0.05
  relative_attitude_error_max_rad: 0.020702318561895833
  body_z_alignment_min: 0.965926
  estimator_health_min: 0.80

# Accepted measurement of the exact production waypoint -> settle -> policy
# route. The shared handoff envelope is also the Lab reset distribution, and
# config validation requires it to cover these observed position bounds plus
# the explicit margin. Refresh this profile when navigation sensors change.
navigation_noise:
  source: benchmarks/press_navigation_handoff/waypoint_settle_20260812.json
  sample_count: 10
  position_margin_m: 0.005
  rotation_margin_rad: 0.004363323129985824
  switch_range_min_m: 0.46459411621093605
  switch_range_max_m: 0.4989912414550766
  lateral_align_max_m: 0.03374635443902746
  relative_attitude_error_max_rad: 0.01633899543191001

# Stage 1 stable, contact-free approach goal and evaluation velocity reference.
goal:
  range_min_m: 0.40
  range_max_m: 0.42
  alignment_error_max_m: 0.01
  relative_attitude_error_max_rad: 0.017453292519943295
  linear_speed_max_mps: 0.03
  angular_speed_max_radps: 0.05
  body_z_alignment_min: 0.965926
  stable_steps: 100
  velocity_reference:
    range_center_m: 0.41
    wall_normal_prediction_horizon_s: 0.4
    wall_normal_alignment_gate_m: 0.03
    wall_normal_gain_per_s: 1.25
    wall_normal_min_mps: -0.04
    wall_normal_max_mps: 0.08
    tangential_gain_per_s: 2.0
    tangential_speed_max_mps: 0.10

# The reward follows the task sequence: position progress outside the fixed
# capture radius, then bounded stabilization credit inside it. Final hold and
# success remain strict 1x-goal predicates.
reward:
  stabilization_capture_radius_m: 0.03
  position_progress_weight: 10.0
  stabilization_weight: 1.0
  predictive_barrier_weight: 10.0
  strict_hold_weight: 1.0
  terminal_success_weight: 150.0
  terminal_failure_weight: 300.0

reset:
  # The policy-transfer experiment overrides this to false so the production
  # actor can fly against a virtual switch pose without wall/button interaction.
  physical_contact_enabled: true
  button_geometry_scale: 1.5
  button_stiffness_scale: 0.5
  button_threshold_scale: 0.5
  switch_distance_from_env_origin_m: 0.40
  switch_wall_offset_m: 0.02
  switch_height_m: 1.0
  wall_half_extents_m: [0.05, 1.0, 1.0]

termination:
  crash_tilt_cos: 0.819152
  min_altitude_m: 0.25
  range_undershoot_min_m: 0.40
  max_wall_normal_distance_m: 1.0
  max_lateral_error_m: 0.30
  max_vertical_error_m: 0.30
  contact_force_threshold_n: 0.25

evaluation:
  validation_seeds: [101, 202, 303]
  test_seeds: [404, 505, 606]
  episodes_per_seed: 100
  success_rate_min: 0.95
  collision_rate_max: 0.01
  collision_penalty: 4.0
  flight_failure_penalty: 3.0
  timeout_penalty: 3.0
  non_success_penalty: 1.0
  dwell_progress_weight: 2.0
  terminal_range_weight: 0.25
  trajectory_alignment_weight: 0.20
  relative_attitude_error_weight: 0.10
  velocity_tracking_weight: 0.20
  angular_velocity_weight: 0.10
  upright_error_weight: 0.10
  action_delta_weight: 0.10
  completion_time_weight: 0.15
