defaults:
  - base_drone

usd_path: /isaac-sim/proj/isaac/assets/LightSwitchWarehouse/quadcopter_500mm.usda
prim_name: DroneSpawned
spawn_volume_prim_name: DroneSpawnVolume
spawn_volume_center: [0.0, 0.0, 1.0]
spawn_volume_half_extents: [2.0, 2.0, 1.0]

# PX4 startup expects the vehicle to be stationary. When enabled, X/Y/yaw are
# still sampled from the spawn volume, but Z is computed from the referenced
# drone bounds so asset changes such as chassis or landing gear do not require
# hand-maintained spawn heights.
spawn_stationary: true
stationary_ground_z: 0.0
stationary_ground_clearance_m: 0.05
stationary_spawn_z_fallback: 0.07
