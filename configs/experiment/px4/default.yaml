defaults:
  - base_px4

# Enabled by default for the custom Isaac bridge workflow.
enabled: true

# Empty -> drone_spawner derives the path as <default_prim>/<drone.prim_name>.
articulation_path: ""

# Pegasus actuator scaling: PX4 controls -> rotor angular velocity references.
input_offset: [0.0, 0.0, 0.0, 0.0]
input_scaling: [1000.0, 1000.0, 1000.0, 1000.0]
zero_position_armed: [100.0, 100.0, 100.0, 100.0]

# Pegasus default quadratic thrust curve and multirotor body dynamics.
rotor_constant: [8.54858e-6, 8.54858e-6, 8.54858e-6, 8.54858e-6]
rolling_moment_coefficient: [1.0e-6, 1.0e-6, 1.0e-6, 1.0e-6]
min_rotor_velocity: [0.0, 0.0, 0.0, 0.0]
max_rotor_velocity: [1100.0, 1100.0, 1100.0, 1100.0]
linear_drag: [0.50, 0.30, 0.0]

connection_type: tcpin
connection_ip: localhost
connection_baseport: 4560
vehicle_id: 0

# Lockstep exchange tunables. physics_rate_hz is NOT here: it is injected from
# sim.physics_hz (the single source of truth for the physics/sensor cadence).
lockstep:
  lockstep_timeout_s: 1.0
  first_heartbeat_timeout_s: 5.0
  # Prime-then-block bootstrap: send at most this many HIL_SENSOR packets
  # non-blocking while PX4 boots, then block for the first HIL_ACTUATOR_CONTROLS
  # so Isaac sim time cannot race ahead and build a startup backlog (the backlog
  # is what makes the bridge fly on stale commands and destabilizes takeoff).
  # Must exceed PX4's boot sensor need (~15); the backlog is then bounded to
  # ~this many ticks and steady-state actuator lag stays ~1 tick.
  bootstrap_prime_ticks: 20
  # Generous deadline (seconds) for PX4's first actuator once the bridge starts
  # blocking. PX4 boots its controllers only AFTER Isaac connects, and that boot
  # competes with Isaac for the host CPU, so under load it can take well over the
  # ~2s nominal wallclock (the "bootstrap" integration flake: sensors=N
  # actuators=0, first actuator never arrives in time). This wait is a strict
  # per-tick lockstep block, not free-running, so a longer deadline patiently
  # waits out a slow boot WITHOUT building a startup backlog; only a genuinely
  # dead PX4 still trips it, just later. Kept much larger than lockstep_timeout_s
  # (which applies only after the first actuator).
  first_actuator_timeout_s: 30.0
  # Safety tripwire (seconds) on steady-state actuator lag -- a regression net,
  # not a happy-path control. Strict blocking lockstep already holds the lag at
  # ~1 tick (0.004s), prime-then-block prevents the startup backlog, and a PX4
  # stall is caught by lockstep_timeout_s above. This only fires if a regression
  # reintroduces a stale-but-still-flowing backlog; on exceed the bridge
  # disconnects with an "actuator lag exceeded sustained limit" reason instead of
  # silently flying stale commands. Set above the brief post-bootstrap drain
  # transient and below the ~0.4s divergence zone.
  max_sustained_actuator_lag_s: 0.5
  heartbeat_rate_hz: 1.0

# Delay opening the PX4 simulator MAVLink endpoint until Isaac physics has
# stepped the spawned drone long enough to settle on the ground. This prevents
# PX4 from initializing its estimator from the spawn drop transient.
startup_settle_time_s: 1.0

gps_enabled: true
gps_send_rate_hz: 250.0
# Enables Pegasus stochastic sensor models:
# - IMU: Gaussian white noise plus random-walk bias terms.
# - GPS: noisy/bias-walk position and altitude; velocity remains ground-truth
#   in the vendored Pegasus model.
# - Barometer: Gaussian pressure noise plus optional drift.
# - Magnetometer: Gaussian white noise plus random-walk bias.
# Keep true for integration tests and normal simulator runs; precision unit
# tests may override this to false.
sensor_noise_enabled: true

home_lat_deg: 47.3977
home_lon_deg: 8.5456
home_alt_m: 488.0

# Persistent diagnostics for PX4 sensor freshness, lockstep, actuator, rotor
# mapping, and disconnect debugging. The template uses the same date directory
# and HH_MM_SS filename convention as PX4 ULog files, with a bridge suffix.
# This path is inside the Isaac container's project mount and maps to
# ./px4/logs/<date>/<time>_bridge.log on the host.
debug_log_path: /isaac-sim/proj/px4/logs/{date}/{time}_bridge.log
debug_log_level: DEBUG
sensor_debug_log_interval: 50

# Bridge-side tilt safety cutoff. When the drone's body-Z axis deviates from
# world-Z by more than this angle (degrees), the bridge zeros all rotor forces
# to prevent inverted thrust after a crash. Set to 0 or a negative value to
# disable.
max_tilt_angle_deg: 60.0
