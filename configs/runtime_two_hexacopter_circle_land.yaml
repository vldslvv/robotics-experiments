defaults:
  - config
  - _self_

# Runtime demonstration experiment: two PX4-backed hexacopter USD assets take
# off, fly one shared XY circle as phase-offset `goto` waypoints, then land. The
# shared airframe config supplies both the six-rotor PX4 bridge arrays and the
# matching generic hexarotor-x SITL airframe for hexacopter_s550.usda.
#
# Run with: make run-all HYDRA_CONFIG=configs/runtime_two_hexacopter_circle_land.yaml

routine:
  steps: []

vehicles:
  - id: 0
    ros: {namespace: /s550_01}
    spawn_xy: [0.0, -2.0]
    drone:
      usd_path: /isaac-sim/proj/isaac/assets/LightSwitchWarehouse/hexacopter_s550.usda
      prim_name: Hexacopter0
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.5
          min_climb_m: 1.5
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: 2.0
          y: 0.0
          z: 2.5
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: 2.0
          z: 2.5
          timeout_s: 25.0
        - kind: goto
          x: -2.0
          y: 0.0
          z: 2.5
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: -2.0
          z: 2.5
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
  - id: 1
    ros: {namespace: /s550_02}
    spawn_xy: [0.0, 2.0]
    drone:
      usd_path: /isaac-sim/proj/isaac/assets/LightSwitchWarehouse/hexacopter_s550.usda
      prim_name: Hexacopter1
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 3.0
          min_climb_m: 2.0
        - kind: hover
          hold_s: 2.0
        - kind: goto
          x: -2.0
          y: 0.0
          z: 3.0
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: -2.0
          z: 3.0
          timeout_s: 25.0
        - kind: goto
          x: 2.0
          y: 0.0
          z: 3.0
          timeout_s: 25.0
        - kind: goto
          x: 0.0
          y: 2.0
          z: 3.0
          timeout_s: 25.0
        - kind: hover
          hold_s: 2.0
        - kind: land
          timeout_s: 30.0
