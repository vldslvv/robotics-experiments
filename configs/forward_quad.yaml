defaults:
  - base
  - _self_

# Runtime demonstration experiment: arm, take off, hold hover, move forward
# along world +X/east, then land. It runs forgivingly: a breach logs and stops
# the routine, leaving manual control available.
#
# Run with: make run-all HYDRA_CONFIG=configs/forward_quad.yaml

scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

routine:
  steps: []

vehicles:
  - id: 0
    ros: {namespace: /x500_01}
    spawn_xy: [0.0, -2.0]
    drone: {prim_name: Drone0}
    routine:
      steps:
        - kind: arm
        - kind: takeoff
          climb_m: 2.0
          min_climb_m: 1.2
        - kind: hover
          hold_s: 2.0
        - kind: forward
          distance_m: 5.0
          timeout_s: 20.0
        - kind: land
          timeout_s: 30.0
