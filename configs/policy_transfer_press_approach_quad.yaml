defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - override experiment/routine@vehicles.x500_01.routine: policy_press_transfer
  - override /experiment/switches/model@switches.model: easy
  - _self_

scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

switches:
  num_switches: 1
  spawn_seed: 0
  spawn_bounds:
    - min: [0.0, 17.99, 2.5]
      max: [0.0, 17.99, 2.5]

vehicles:
  x500_01:
    id: 0
    ros: {namespace: /x500_01}
    spawn:
      position_xy: [0.0, 14.0]
      yaw_rad: 0.0

rl:
  episode_length_s: 45.0
  press:
    task: approach
    reset:
      mix:
        - source: measured_navigation_handoff
          weight: 0.8
        - source: pinned_flight_parameters
          weight: 0.2
