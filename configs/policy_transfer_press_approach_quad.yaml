defaults:
  - base
  - experiment/vehicle@vehicles.x500_01: holybro_x500_v2
  - _self_

# Post-training PX4 policy-transfer acceptance at three entry ranges. Use the
# production warehouse geometry and keep physical contact enabled so each
# approach must stop without touching the wall or switch.
scene: "@isaac/assets/LightSwitchWarehouse/Warehouse.usd"

switches:
  num_switches: 1
  spawn_seed: 0
  press_threshold: 0.005
  spawn_bounds:
    - min: [0.0, 17.99, 2.5]
      max: [0.0, 17.99, 2.5]

vehicles:
