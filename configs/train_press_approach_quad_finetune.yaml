defaults:
  - train_press_approach_quad
  - _self_

# Actor-only continuation keeps the low-rate, low-noise Stage 1 fine-tuning
# recipe separate from scratch training. Its slower wall-normal reference
# teaches the actor to brake before the lower acceptance boundary under the
# aligned plant's command delay; the goal band and acceptance limits remain
# unchanged.
rl:
  press:
    policy:
      actor:
        initial_noise_std: 0.01
    reward:
      # The terminal undershoot trace is the only remaining failure mode. Give
      # it greater weight than a successful terminal transition while keeping
      # the exact boundary and evaluation contract unchanged.
      flight_failure_weight: 300.0
    goal:
      velocity_reference:
        range_center_m: 0.415
        wall_normal_max_mps: 0.04
  training:
    training_mode: actor-only
    # Short rate pilots retain the unchanged held-out selection contract while
    # testing four checkpoints before a full continuation is authorized.
    max_iterations: 15
    save_interval: 5
    learning_rate: 3.0e-5
    schedule: fixed
    entropy_coef: 0.0
