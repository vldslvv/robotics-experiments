defaults:
  - train_press_approach_quad
  - _self_

# Actor-only continuation keeps the former low-rate, low-noise Stage 1
# fine-tuning recipe separate from scratch training.
rl:
  press:
    policy:
      actor:
        initial_noise_std: 0.01
  training:
    training_mode: actor-only
    max_iterations: 50
    save_interval: 5
    learning_rate: 1.0e-6
    schedule: fixed
    entropy_coef: 0.0
