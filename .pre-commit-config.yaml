repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # ruff/mypy run as mirror hooks: fast, self-bootstrapping, per-changed-file,
  # and ruff auto-fixes in place on commit. Versions are kept in sync with the
  # `dev` extra in pyproject.toml. Because they only see staged files, they are
  # not a whole-repo gate -- run `uv run ruff check` / `uv run mypy src tests`
  # for a full sweep.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Scoped to the typed source/test tree, matching the
        # `uv run mypy src tests` full sweep. The isaac/runtime and vendored
        # pegasus trees can't resolve isaacsim/pxr/carb in the mirror's
        # isolated env, so checking them only yields false positives.
        files: ^(src|tests)/
        additional_dependencies:
          - types-requests
        args: ["--ignore-missing-imports"]

  # pytest has no per-file notion, so it runs locally through the project venv
  # over the whole suite on every commit. The canonical non-mutating gate is
  # `make check`, which also runs in the CPU-only pull-request workflow.
  - repo: local
    hooks:
      - id: binary-asset-policy
        name: reject unlisted binary assets
        entry: uv run python make/scripts/check_binary_files.py
        language: system
        types: [file]

      - id: pytest
        name: pytest (uv run pytest)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture unused production code
        entry: uv run --extra dev vulture --config pyproject.toml
        language: system
        pass_filenames: false
        always_run: true

  # Keep uv.lock in sync with pyproject.toml. The official uv-lock hook
  # regenerates the lockfile and fails if that changes anything, so the lock
  # can't silently drift (reinforces the `uv lock --check` hard rule). It
  # self-bootstraps its own uv and is scoped to the lock/manifest files.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.21
    hooks:
      - id: uv-lock

  # Shell + Dockerfile linters. Self-bootstrapping: no host shellcheck/hadolint
  # or Docker needed. Both are enforced on commit now that their findings are
  # addressed. hadolint's intentional ignores (root USER, apt cache retention,
  # version pinning, etc.) live in `.hadolint.yaml` at the repo root; shellcheck
  # uses in-script `# shellcheck` directives (for example the SC1090 source
  # directives in the px4/docker run scripts) where needed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # PX4 ROMFS airframe rc fragments use PX4 startup conventions (`${R}`
        # sourcing, `param set-default`) that are intentionally not
        # shellcheck-idiomatic; the stock upstream airframes are not
        # shellcheck-clean either. They are PX4 build inputs, not host scripts.
        exclude: '^px4/docker/airframes/'

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint

  # Text/config linters. Self-bootstrapping (pure-Python / vendored binary, no
  # host tools needed). codespell catches misspellings across the doc-heavy
  # tree; yamllint lints YAML semantics beyond the parse-only check-yaml hook
  # (duplicate keys, indentation, truthy ambiguity) over the Hydra configs;
  # taplo lints TOML beyond parse-only check-toml. Tunables live at the repo
  # root: `.codespellrc`, `.yamllint.yaml`, and `.taplo.toml`.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      # Drop the default --default-schema-catalogs: that schemastore catalog
      # endpoint fails to decode at taplo v0.9.3. Schemas are instead associated
      # directly in `.taplo.toml` (pyproject.toml is still schema-validated).
      - id: taplo-lint
        args: []

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf  # Forbid files containing CRLF end-lines to be committed
      - id: remove-crlf  # Replace CRLF end-lines by LF ones before committing
      # Makefiles require literal tabs in recipe lines, so they must be exempt
      # from the tab forbid/remove hooks or make targets break.
      - id: forbid-tabs  # Forbid files containing tabs to be committed
        exclude: '(?x)((^|/)Makefile$|\.mk$)'
      - id: remove-tabs  # Replace tabs by whitespaces before committing
        args: [--whitespaces-count, '4']  # defaults to: 4
        exclude: '(?x)((^|/)Makefile$|\.mk$)'
      - id: chmod  # Set file permissions
        args: ['644']
        files: \.md$
